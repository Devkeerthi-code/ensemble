# Lint, typecheck, unit tests and build on every push. The database isolation test is skipped here (no DATABASE_URL).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Placeholders: prisma generate (postinstall) and the build need these set, but never connect.
    env:
      AUTH_SECRET: ci-only-placeholder-secret-not-used-at-runtime
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
